<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Repasito · 1 mes gratis</title>
  <meta name="description" content="Repasito corrige los deberes con una foto y explica cada error con palabras sencillas.">
  <meta property="og:title" content="Repasito: 1 mes de Plus gratis">
  <meta property="og:description" content="Corrige los deberes con una foto y entiende cada error para poder ayudar en casa.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/repasito/partners/style.css">
  <style>
    /* Creator smart link: one bio link for every phone. Shared look with the partner pages. */
    main { max-width: 560px; }
    .hero-code { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 18px; }
    .stores { display: grid; gap: 10px; margin: 18px 0 8px; }
    .stores .btn { text-align: center; padding: 15px 18px; font-size: 16px; }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .hint { font-size: 14px; color: var(--muted); }
    .ok { color: var(--ok); font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header class="brand"><div class="logo">R</div><span>Repasito</span></header>

  <!-- Filled in by the script below; without JavaScript this generic text and the store links remain. -->
  <h1 id="title">Corrige los deberes con una foto</h1>
  <p class="lead" id="lead">Repasito explica cada error con palabras sencillas para que puedas ayudar en casa.</p>

  <section class="card" id="code-card" hidden>
    <p style="margin:0 0 6px" id="code-label">Tu código</p>
    <div class="hero-code">
      <span class="code" id="code"></span>
      <button class="secondary" id="copy">Copiar</button>
    </div>
    <p class="hint" id="code-note" style="margin:0"></p>
  </section>

  <div class="stores" id="stores">
    <a class="btn" id="ios-btn" href="https://apps.apple.com/es/app/id6812275331">App Store (iPhone)</a>
    <a class="btn ghost" id="android-btn" href="https://play.google.com/store/apps/details?id=com.repasito.homework">Google Play (Android)</a>
  </div>
  <p class="hint" id="note"></p>

  <footer>Repasito es una app de Chispapps · <a href="/repasito/privacidad">Privacidad</a> · <a href="/repasito/partners/unete.html">¿Creas contenido? Colabora con nosotros</a></footer>
</main>

<script>
(function () {
  // How Android visitors are handled while the creator programme grows:
  //   'note' : Google Play link only, with a note that the free month code works on iPhone for now.
  //   'code' : show the code and where to enter it (each creator has a Google Play promo code).
  //   'auto' : go straight to Google Play; the app reads the install referrer and offers the
  //            free month itself (Phase 1 of the growth plan).
  var ANDROID_MODE = 'note';
  var APPLE_ID = '6812275331';
  var ANDROID_PACKAGE = 'com.repasito.homework';

  var T = {
    es: {
      titlePlain: 'Corrige los deberes con una foto',
      titleCode: 'Tu mes gratis de Repasito Plus',
      lead: 'Repasito corrige los deberes con una foto y explica cada error con palabras sencillas para que puedas ayudar en casa.',
      codeLabel: 'Tu código',
      copy: 'Copiar', copied: 'Copiado',
      iosOpening: 'Abriendo la App Store con tu código ya escrito…',
      iosRedeem: 'Canjear en la App Store (iPhone)',
      iosNote: 'Si no se abre la App Store, toca el botón. Si estás dentro de Instagram o TikTok, abre el enlace en Safari.',
      androidNote: 'En Android, Repasito tiene 10 páginas gratis cada semana. El mes de Plus con código funciona por ahora en iPhone.',
      androidCode: 'Al suscribirte en Google Play, toca la forma de pago y elige «Canjear código».',
      desktop: 'Abre este enlace en tu móvil, o busca Repasito en tu tienda de apps.',
      newOnly: 'Para quien se suscribe a Repasito Plus por primera vez.'
    },
    en: {
      titlePlain: 'Check homework with a photo',
      titleCode: 'Your free month of Repasito Plus',
      lead: 'Repasito checks homework from a photo and explains each mistake in plain words, so you can help at home.',
      codeLabel: 'Your code',
      copy: 'Copy', copied: 'Copied',
      iosOpening: 'Opening the App Store with your code filled in…',
      iosRedeem: 'Redeem in the App Store (iPhone)',
      iosNote: 'If the App Store does not open, tap the button. Inside Instagram or TikTok, open the link in Safari.',
      androidNote: 'On Android, Repasito gives 10 free pages every week. The free month code works on iPhone for now.',
      androidCode: 'When you subscribe on Google Play, tap the payment method and choose "Redeem code".',
      desktop: 'Open this link on your phone, or search for Repasito in your app store.',
      newOnly: 'For first-time Repasito Plus subscribers.'
    }
  };
  var lang = /^en\b/i.test(navigator.language || '') ? 'en' : 'es';
  var t = T[lang];
  document.documentElement.lang = lang;

  var params = new URLSearchParams(location.search);
  // Apple custom codes: letters and digits only, up to 64 characters.
  var code = (params.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 64);

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var appleStore = 'https://apps.apple.com/' + (lang === 'en' ? 'us' : 'es') + '/app/id' + APPLE_ID;
  var appleRedeem = 'https://apps.apple.com/redeem?ctx=offercodes&id=' + APPLE_ID + '&code=' + encodeURIComponent(code);
  var play = 'https://play.google.com/store/apps/details?id=' + ANDROID_PACKAGE + '&hl=' + lang +
    (code ? '&referrer=' + encodeURIComponent('utm_source=creator&utm_campaign=' + code.toLowerCase()) : '');

  var $ = function (id) { return document.getElementById(id); };
  $('title').textContent = t.titlePlain;
  $('lead').textContent = t.lead;
  $('ios-btn').href = appleStore;
  $('android-btn').href = play;

  if (!code) return; // Plain store page: no code in the link.

  document.title = 'Repasito · ' + (lang === 'en' ? '1 month free' : '1 mes gratis');
  $('title').textContent = t.titleCode;
  $('code').textContent = code;
  $('code-label').textContent = t.codeLabel;
  $('code-note').textContent = t.newOnly;
  $('code-card').hidden = false;
  $('copy').textContent = t.copy;
  $('copy').onclick = function () {
    var done = function () { $('copy').textContent = t.copied; setTimeout(function () { $('copy').textContent = t.copy; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
    else done();
  };

  if (isIOS) {
    $('ios-btn').href = appleRedeem;
    $('ios-btn').textContent = t.iosRedeem;
    $('android-btn').hidden = true;
    $('note').textContent = t.iosNote;
    $('lead').textContent = t.iosOpening;
    location.replace(appleRedeem);
    return;
  }

  if (isAndroid) {
    $('ios-btn').hidden = true;
    $('android-btn').className = 'btn';
    if (ANDROID_MODE === 'auto') { location.replace(play); return; }
    if (ANDROID_MODE === 'code') { $('note').textContent = t.androidCode; return; }
    $('code-card').hidden = true;
    document.title = 'Repasito';
    $('title').textContent = t.titlePlain;
    $('note').textContent = t.androidNote;
    return;
  }

  // Computer: show everything and suggest the phone.
  $('ios-btn').href = appleRedeem;
  $('ios-btn').textContent = t.iosRedeem;
  $('note').textContent = t.desktop;
})();
</script>
</body>
</html>
